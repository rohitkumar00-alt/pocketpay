name: Build Android APK

# Build main after its tests pass; manual runs remain available.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Test wallet core
        run: python -m unittest discover -s tests -v
      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential
          python -m venv .venv-build
          .venv-build/bin/python -m pip install pip==24.0 setuptools==69.2.0 wheel==0.43.0
          .venv-build/bin/python -m pip install buildozer==1.5.0 Cython==0.29.34 virtualenv==20.26.6
      - name: Build debug APK
        # Activation prevents Buildozer from installing its dependencies with --user.
        run: |
          source .venv-build/bin/activate
          buildozer -v android debug
      - name: Upload installable demo
        uses: actions/upload-artifact@v7
        with:
          name: pocketpay-debug-arm64
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
